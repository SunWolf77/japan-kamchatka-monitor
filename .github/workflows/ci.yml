name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Typecheck & build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Production build (Nitro → Vercel output)
        run: npm run build
        env:
          # CI build must not require real secrets for core seismic monitor
          CI: "true"
          VITE_AUTH_ENABLED: "false"

      - name: Confirm Vercel output
        run: |
          test -d .vercel/output
          test -f .vercel/output/nitro.json
          echo "Vercel Nitro output OK"
          ls -la .vercel/output | head
